<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechControl</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 5px;
        }

        nav {
            background: white;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav button {
            border: none;
            background: #1f4e79;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        nav button:hover {
            background: #163a5c;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .tela {
            display: none;
        }

        .tela.ativa {
            display: block;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1f4e79;
            margin-bottom: 15px;
        }

        h3 {
            margin-bottom: 10px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
        }

        .btn {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background: #163a5c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #1f4e79;
            color: white;
        }

        .disponivel {
            color: green;
            font-weight: bold;
        }

        .emprestado {
            color: #d68910;
            font-weight: bold;
        }

        .indisponivel {
            color: #c0392b;
            font-weight: bold;
        }

        .inicio {
            text-align: center;
            padding: 40px 20px;
        }

        .inicio p {
            margin: 15px 0;
            line-height: 1.6;
        }

        .mensagem {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #eaf2f8;
        }

        @media (max-width: 700px) {
            table {
                font-size: 13px;
            }

            nav {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>TechControl</h1>
    <p>Sistema de Controle de Empréstimo de Equipamentos Escolares</p>
</header>
